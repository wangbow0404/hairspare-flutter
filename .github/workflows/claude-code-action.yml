# Claude Code Action — PR/이슈에서 @claude 멘션 시 AI 리뷰·코드 수정
#
# 최초 1회 설정 (repo admin):
#   1. 터미널: claude → /install-github-app
#   2. GitHub repo Settings → Secrets → ANTHROPIC_API_KEY 추가
#   3. main에 push
#
# 사용: PR 또는 이슈 댓글에 "@claude 리뷰해줘" 등
# Docs: https://github.com/anthropics/claude-code-action

name: Claude Code Action

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned, labeled]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
